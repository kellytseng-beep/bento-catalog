<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>便當目錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EAE0C9;
    --paper-deep: #E1D4B4;
    --card: #F8F3E6;
    --tray: #EFE9DA;
    --tray-shadow-in: rgba(70,58,38,0.18);
    --tray-shadow-hi: rgba(255,255,255,0.55);
    --ink: #332A22;
    --ink-soft: #6B5F4E;
    --rim: #B08D57;
    --stamp: #A23E32;
    --stamp-deep: #7E2F26;
    --steel: #7C8A86;
    --steel-deep: #56635F;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background:
      radial-gradient(ellipse at top left, var(--paper-deep), var(--paper) 60%);
    color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif;
    line-height: 1.6;
    padding: 0 0 80px;
  }

  a { color: inherit; }

  /* ---------- Header ---------- */
  header{
    max-width: 780px;
    margin: 0 auto;
    padding: 48px 24px 24px;
    text-align: left;
  }
  header h1{
    font-family: 'Noto Serif TC', serif;
    font-weight: 900;
    font-size: clamp(32px, 6vw, 46px);
    margin: 0;
    letter-spacing: 0.02em;
  }
  header .rule{
    height: 3px;
    margin-top: 20px;
    background: repeating-linear-gradient(90deg, var(--rim), var(--rim) 10px, transparent 10px, transparent 16px);
    opacity: 0.6;
  }

  /* ---------- Quick jump nav ---------- */
  .quicknav{
    max-width: 780px;
    margin: 20px auto 0;
    padding: 0 24px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .quicknav-row{
    display: flex;
    align-items: stretch;
    gap: 6px;
  }
  .quicknav a{
    flex: 1;
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-size: 15px;
    text-decoration: none;
    color: var(--ink);
    padding: 8px 14px;
    border: 1px solid rgba(176,141,87,0.45);
    border-radius: 8px;
    background: var(--card);
    cursor: pointer;
  }
  .quicknav a:hover{ background: var(--paper-deep); }
  .quicknav .num{
    font-family: 'Noto Serif TC', serif;
    font-weight: 900;
    color: var(--stamp-deep);
    flex: none;
  }
  .quicknav-del{
    flex: none;
    min-width: 38px;
    padding: 0 10px;
    border: 1px solid rgba(176,141,87,0.45);
    border-radius: 8px;
    background: var(--card);
    color: var(--ink-soft);
    font-size: 13.5px;
    cursor: pointer;
    white-space: nowrap;
  }
  .quicknav-del:hover{ background: #7E2F26; color: #F8F3E4; border-color: #7E2F26; }
  .quicknav-del.confirming{ background: #7E2F26; color: #F8F3E4; border-color: #7E2F26; font-weight: 700; }
  .back-to-index{
    display: block;
    margin-top: 14px;
    text-align: center;
    font-size: 13px;
    color: var(--steel-deep);
    text-decoration: none;
    cursor: pointer;
  }
  .back-to-index:hover{ text-decoration: underline; }

  /* ---------- Shop list ---------- */
  main{
    max-width: 780px;
    margin: 0 auto;
    padding: 32px 24px 0;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  .shop{
    background: var(--card);
    border: 1px solid rgba(176,141,87,0.4);
    border-radius: 6px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 10px 24px rgba(70,58,38,0.10);
    overflow: hidden;
    scroll-margin-top: 20px;
  }

  .shop-head{
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    padding: 26px 26px 18px;
    border-bottom: 1px dashed rgba(176,141,87,0.55);
  }
  .shop-head .titles{ min-width: 0; }
  .shop-name{
    font-family: 'Noto Serif TC', serif;
    font-weight: 900;
    font-size: clamp(22px, 4vw, 28px);
    margin: 0 0 4px;
  }
  .shop-alias{
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 8px;
  }
  .shop-area-tags{
    display:flex; gap:8px; flex-wrap: wrap;
  }
  .tag{
    font-size: 12.5px;
    color: var(--steel-deep);
    background: rgba(124,138,134,0.16);
    border: 1px solid rgba(124,138,134,0.4);
    padding: 2px 9px;
    border-radius: 999px;
  }
  .stamp{
    flex: none;
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 2px solid var(--stamp);
    color: var(--stamp);
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif TC', serif;
    font-weight: 900;
    font-size: 20px;
    transform: rotate(-6deg);
    opacity: 0.85;
  }

  .verified{
    padding: 10px 26px 0;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  /* Bento tray grid */
  .tray{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    padding: 18px 26px 6px;
  }
  @media (max-width: 520px){
    .tray{ grid-template-columns: 1fr; }
  }
  .cell{
    background: var(--tray);
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: inset 0 2px 5px var(--tray-shadow-in), inset 0 -1px 0 var(--tray-shadow-hi);
  }
  .cell.menu-cell{ grid-column: 1 / -1; }
  .cell h3{
    margin: 0 0 8px;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--stamp-deep);
    display:flex; align-items:center; gap:6px;
  }
  .cell h3 svg{ width:15px; height:15px; flex:none; }
  .cell p, .cell ul{ margin: 0; font-size: 14.5px; }
  .cell ul{ padding-left: 18px; }
  .cell li{ margin-bottom: 2px; }
  .cell .note{
    display:block; margin-top:8px;
    font-size: 12px; color: var(--ink-soft);
  }
  .phone-link{
    display:inline-block; margin-top: 6px;
    font-size: 13.5px; font-weight: 700; color: var(--steel-deep);
    text-decoration: none; border-bottom: 1px solid var(--steel-deep);
  }

  /* Menu price list */
  .menu-list{ list-style:none; padding:0; margin:0; }
  .menu-list li{
    display:flex; justify-content:space-between; align-items:baseline;
    gap: 12px;
    padding: 6px 0;
    border-bottom: 1px dashed rgba(176,141,87,0.4);
    font-size: 14.5px;
  }
  .menu-list li:last-child{ border-bottom:none; }
  .menu-list .item{ flex: 1; }
  .menu-list .price{
    flex: none;
    font-weight: 700;
    color: var(--stamp-deep);
    font-family: 'Noto Serif TC', serif;
  }

  /* Map */
  .map-wrap{
    margin: 18px 26px 0;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(176,141,87,0.5);
    background: var(--tray);
  }
  .route-text{
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 14px 16px;
    font-size: 14.5px;
    line-height: 1.6;
  }
  .route-text svg{ width: 18px; height: 18px; flex: none; margin-top: 2px; color: var(--stamp-deep); }
  .route-text strong{ color: var(--stamp-deep); }
  .map-link{
    display:block;
    padding: 10px 12px;
    background: var(--tray);
    font-size: 13.5px;
    text-align: center;
    text-decoration: none;
    color: var(--steel-deep);
    font-weight: 700;
    border-top: 1px solid rgba(176,141,87,0.4);
  }
  .map-link:hover{ background: var(--paper-deep); }

  /* Photos / press row */
  .extras{
    padding: 20px 26px 26px;
  }
  .extras h3{
    font-size: 13.5px;
    font-weight: 700;
    color: var(--stamp-deep);
    margin: 0 0 10px;
  }
  .photo-row{
    display:flex; gap:10px; overflow-x:auto; padding-bottom: 4px; margin-bottom: 16px;
  }
  .photo-tile{
    flex: none;
    width: 130px; height: 96px;
    border-radius: 8px;
    background: linear-gradient(160deg, var(--paper-deep), var(--tray));
    border: 1px solid rgba(176,141,87,0.5);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 6px;
    text-decoration:none;
    color: var(--ink);
    padding: 8px;
    text-align:center;
  }
  .photo-tile svg{ width: 26px; height: 26px; opacity: .65; flex:none; }
  .photo-tile span{ font-size: 12px; line-height:1.3; font-weight: 700; }
  .photo-tile small{ font-size: 10.5px; color: var(--ink-soft); font-weight: 400; }
  .photo-tile:hover{ background: linear-gradient(160deg, var(--paper-deep), var(--paper)); }

  .link-row{
    display:flex; flex-wrap:wrap; gap:8px;
  }
  .link-chip{
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 8px;
    background: var(--tray);
    text-decoration:none;
    color: var(--ink);
    border: 1px solid rgba(176,141,87,0.4);
  }
  .link-chip:hover{ background: var(--paper-deep); }

  footer{
    max-width: 780px;
    margin: 24px auto 0;
    padding: 0 24px;
    font-size: 13px;
    color: var(--ink-soft);
  }
</style>
</head>

/* ---------- Icons ---------- */
const icon = {
  clock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>`,
  pin: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-7.2 7-12a7 7 0 1 0-14 0c0 4.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.4"/></svg>`,
  car: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 16V11l2-5h12l2 5v5"/><path d="M4 16h16"/><circle cx="7.5" cy="16.5" r="1.6"/><circle cx="16.5" cy="16.5" r="1.6"/></svg>`,
  bowl: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18a9 9 0 0 1-18 0z"/><path d="M8 12c0-3 1.8-5 4-5s4 2 4 5"/></svg>`,
  photo: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10.5" r="1.6"/><path d="M21 16l-5.5-5-4 4L8 12l-5 5"/></svg>`
};

function esc(s){ return (s ?? "").toString(); }
function slugId(i){ return `shop-${i+1}`; }


function renderCell(title, iconKey, bodyHtml, note, extraClass){
  return `
    <div class="cell${extraClass ? ' ' + extraClass : ''}">
      <h3>${icon[iconKey]}${title}</h3>
      ${bodyHtml}
      ${note ? `<span class="note">${esc(note)}</span>` : ""}
    </div>`;
}

function shopCard(shop, i){
  const areaTags = `<span class="tag">${esc(shop.area)}</span>` +
    (shop.dishTags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("");

  const hoursBody = `<ul>${(shop.hours || []).map(h => `<li>${esc(h)}</li>`).join("")}</ul>`;

  const addrBody = `
    <p>${esc(shop.address)}</p>
    <a class="phone-link" href="tel:${esc((shop.phone||"").replace(/-/g,""))}">📞 ${esc(shop.phone)}</a>`;
  const addrNote = shop.phoneNote || "";

  const parkBody = `<ul>${(shop.parking || []).map(p => `<li>${esc(p)}</li>`).join("")}</ul>`;

  const menuBody = `<ul class="menu-list">${(shop.menu || []).map(m =>
    `<li><span class="item">${esc(m.item)}</span><span class="price">${esc(m.price)}</span></li>`
  ).join("")}</ul>`;

  const hasGeo = typeof shop.lat === "number" && typeof shop.lng === "number" && !(shop.lat === 0 && shop.lng === 0);
  const mapOpen = hasGeo
    ? `https://www.google.com/maps/search/?api=1&query=${shop.lat},${shop.lng}${shop.placeId ? `&query_place_id=${encodeURIComponent(shop.placeId)}` : ""}`
    : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(shop.name + " " + shop.address)}`;
  const TKU = { lat: 25.1740706, lng: 121.4473008, placeId: "ChIJ20tUwfivQjQRKzazlPT03AE" };
  const directionsFromTKU = hasGeo
    ? `https://www.google.com/maps/dir/?api=1&origin=${TKU.lat},${TKU.lng}&origin_place_id=${TKU.placeId}&destination=${shop.lat},${shop.lng}&destination_place_id=${encodeURIComponent(shop.placeId || "")}&travel_mode=driving`
    : "";
  const imgSearchUrl = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(shop.name + " " + shop.area + " 便當")}`;

  const photoTiles = [
    { label: "Google 圖片搜尋", small: "隨時更新的最新照片", url: imgSearchUrl },
    ...(shop.photoLinks || [])
  ].map(p =>
    `<a class="photo-tile" href="${esc(p.url)}" target="_blank" rel="noopener">
      ${icon.photo}<span>${esc(p.label)}</span>${p.small ? `<small>${esc(p.small)}</small>` : ""}
    </a>`
  ).join("");

  const links = (shop.links || []).map(l =>
    `<a class="link-chip" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`
  ).join("");

  return `
  <article class="shop" id="${slugId(i)}" data-area="${esc(shop.area)}">
    <div class="shop-head">
      <div class="titles">
        <h2 class="shop-name">${esc(shop.name)}</h2>
        ${shop.alias ? `<p class="shop-alias">${esc(shop.alias)}</p>` : ""}
        <div class="shop-area-tags">${areaTags}</div>
      </div>
      <div class="stamp">${esc(shop.stamp || "")}</div>
    </div>

    ${shop.verified ? `<div class="verified">${esc(shop.verified)}</div>` : ""}

    <div class="tray">
      ${renderCell("營業時間與公休", "clock", hoursBody, shop.hoursNote)}
      ${renderCell("地址・電話", "pin", addrBody, addrNote)}
      ${renderCell("附近停車", "car", parkBody)}
      ${renderCell("便當菜單與價目", "bowl", menuBody, shop.menuNote, "menu-cell")}
    </div>

    <div class="map-wrap">
      <div class="route-text">
        ${icon.pin}
        <div>
          <strong>從淡江大學出發：</strong> ${shop.routeFromTKU ? esc(shop.routeFromTKU) : "路線資料尚未建立"}
        </div>
      </div>
      <a class="map-link" href="${mapOpen}" target="_blank" rel="noopener">在 Google 地圖開啟（完整地圖與路線）→</a>
      ${directionsFromTKU ? `<a class="map-link" href="${directionsFromTKU}" target="_blank" rel="noopener">🎓 從淡江大學出發的路線與時間 →</a>` : ""}
    </div>

    <div class="extras">
      <h3>照片｜點卡片看實拍</h3>
      <div class="photo-row">${photoTiles}</div>
      <h3>相關報導與連結</h3>
      <div class="link-row">${links}</div>
      <a class="back-to-index" data-back-to-index>↑ 回目錄</a>
    </div>
  </article>`;
}

/* 刪除的店家用 localStorage 記住（用店名當 key），重新整理頁面後仍會保持已刪除的狀態。
   這只是「在這個瀏覽器裡隱藏」，不會動到上面 shops 陣列的原始資料，
   如果想恢復，清除瀏覽器的 localStorage（或換一台裝置開啟）就會全部顯示回來。 */
const DELETED_KEY = "bento-catalog-deleted-v1";
function loadDeleted(){
  try { return new Set(JSON.parse(localStorage.getItem(DELETED_KEY) || "[]")); }
  catch(e){ return new Set(); }
}
function saveDeleted(set){
  try { localStorage.setItem(DELETED_KEY, JSON.stringify([...set])); } catch(e){}
}
let deleted = loadDeleted();

function visibleShops(){
  return shops.filter(s => !deleted.has(s.name));
}

function render(){
  const list = document.getElementById("list");
  list.innerHTML = visibleShops().map((s, i) => shopCard(s, i)).join("");
  document.getElementById("count").textContent = visibleShops().length;
  list.querySelectorAll("[data-back-to-index]").forEach(a => {
    a.addEventListener("click", (e) => {
      e.preventDefault();
      document.getElementById("quicknav").scrollIntoView({ behavior: "smooth", block: "start" });
    });
  });
}

function renderQuickNav(){
  const el = document.getElementById("quicknav");
  el.innerHTML = visibleShops().map((s, i) => `
    <div class="quicknav-row">
      <a data-target="${slugId(i)}"><span class="num">${i+1}號</span><span>${esc(s.name)}</span></a>
      <button class="quicknav-del" type="button" data-delete-name="${esc(s.name)}" title="從目錄中刪除這間店" aria-label="刪除 ${esc(s.name)}">✕</button>
    </div>
  `).join("");
  el.querySelectorAll("a[data-target]").forEach(a => {
    a.addEventListener("click", (e) => {
      e.preventDefault();
      const target = document.getElementById(a.dataset.target);
      if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  });
  el.querySelectorAll("[data-delete-name]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      const name = btn.dataset.deleteName;
      if (btn.dataset.confirming === "1") {
        clearTimeout(Number(btn.dataset.timerId));
        deleted.add(name);
        saveDeleted(deleted);
        renderQuickNav();
        render();
        return;
      }
      btn.dataset.confirming = "1";
      btn.textContent = "確定？";
      btn.classList.add("confirming");
      const timerId = setTimeout(() => {
        btn.dataset.confirming = "0";
        btn.textContent = "✕";
        btn.classList.remove("confirming");
      }, 3000);
      btn.dataset.timerId = String(timerId);
    });
  });
}

renderQuickNav();
render();
</script>
